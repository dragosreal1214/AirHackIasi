[tool.poetry]
name = "aerly-api"
version = "0.1.0"
description = "Aerly API — fog disruption copilot backend."
authors = ["Aerly Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.35" }
asyncpg = "^0.30.0"
alembic = "^1.13.0"
structlog = "^24.4.0"
slowapi = "^0.1.9"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
bcrypt = "^4.2.0"
httpx = "^0.27.0"
celery = "^5.4.0"
redis = "^5.1.0"
xgboost = "^3.0.0"
scikit-learn = "^1.5.0"
pandas = "^2.2.0"
numpy = "^2.1.0"
python-metar = "^1.4.0"
twilio = "^9.3.0"
pywebpush = "^2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
ruff = "^0.7.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
